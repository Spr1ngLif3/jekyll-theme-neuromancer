# ---------------------------------------------------------------------------
# Demo site configuration for jekyll-theme-neuromancer.
# Everything under `neuromancer:` is a theme option — see README.md.
# ---------------------------------------------------------------------------

title: neuromancer
description: >-
  A minimal dark Jekyll theme for hackers, tinkerers and
  denizens of the sprawl.
url: ""        # e.g. https://username.github.io
baseurl: ""    # e.g. /blog — leave empty for a user/organisation site
lang: en
timezone: UTC

author:
  name: anon
  url: ""

permalink: /:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed
  # The theme uses @import so it also compiles on classic GitHub Pages
  # (libsass). Silence Dart Sass's @import deprecation notice on Jekyll 4.
  quiet_deps: true
  silence_deprecations: [import]

neuromancer:
  # Accent colour: green | cyan | magenta | amber | violet
  accent: green
  # Default colour scheme: dark | light | auto (follow the visitor's OS)
  color_scheme: dark
  # Show the light/dark toggle in the sidebar (visitor choice is remembered)
  theme_toggle: true
  # Square image in the sidebar, between the title and the navigation
  # (path in your site or full URL; non-square images are cropped).
  # avatar: /assets/images/avatar.png
  # avatar_alt: Portrait of anon        # defaults to author.name
  # Rendered in the header as <prompt_user>@<prompt_host>:~$
  prompt_user: guest
  # prompt_host: my-site     # defaults to the slugified site title
  # Subtle CRT scanline overlay
  scanlines: false
  date_format: "%Y-%m-%d"
  # Number of posts on the home page (0 hides the list)
  home_posts: 5
  show_excerpts: true
  # Words of post body shown in the home page list
  excerpt_words: 35
  archive_url: /blog/
  tags_url: /tags/
  # Search box in the top-right corner; Enter opens search_url
  search: true
  search_url: /search/
  # Show "powered by jekyll + neuromancer" in the footer
  credit: true

  # Shell session shown on the home page. Each entry is a `command` and an
  # optional `output` (multi-line output is preserved). When omitted, the
  # block shows `whoami` (author name) and `cat motd` (site description).
  terminal:
    - command: whoami
      output: anon
    - command: cat motd
      output: >-
        A minimal dark Jekyll theme for hackers, tinkerers and
        denizens of the sprawl.

  nav:
    - title: blog
      url: /blog/
    - title: tags
      url: /tags/
    - title: about
      url: /about/

  social:
    - name: github
      url: https://github.com/Spr1ngLif3

  # Comments via giscus (https://giscus.app). Only rendered when
  # JEKYLL_ENV=production and `repo` is set.
  # comments:
  #   giscus:
  #     repo: username/repo
  #     repo_id: R_xxxxxxxx
  #     category: Comments
  #     category_id: DIC_xxxxxxxx

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - .github/
  - .editorconfig
  - CHANGELOG.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE.txt
  - README.md
  - SECURITY.md
  - gemfiles/
  - script/
  - vendor/
  - "*.gem"
  - "*.gemspec"
