{%- comment -%}
  Post metadata line (publication date).
  Params:
    post (required) the post object
{%- endcomment -%}
{%- assign date_format = site.neuromancer.date_format | default: "%Y-%m-%d" -%}
<p class="post-meta">
  <time class="dt-published" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: date_format }}</time>
</p>
