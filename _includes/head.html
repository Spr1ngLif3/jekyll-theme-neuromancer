<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{% if color_scheme == 'auto' %}dark light{% else %}{{ color_scheme }}{% endif %}">
  <meta name="theme-color" content="{% if color_scheme == 'light' %}#f5f6f8{% else %}#07080c{% endif %}">
  <script>
    // Mark JavaScript as available (enables the mobile menu) and apply the
    // visitor's saved theme before first paint (see theme toggle).
    document.documentElement.classList.add("js");
    try {
      var nmTheme = localStorage.getItem("nm-theme");
      if (nmTheme === "light" || nmTheme === "dark") document.documentElement.setAttribute("data-theme", nmTheme);
    } catch (e) {}
  </script>
  {%- seo %}
  {%- feed_meta %}
  <link rel="preload" href="{{ '/assets/fonts/ibm-plex-mono-400.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/ibm-plex-mono-600.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ site.neuromancer.favicon | default: '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  {%- include custom-head.html %}
</head>
