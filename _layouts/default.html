<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" data-accent="{{ site.neuromancer.accent | default: 'green' }}"{% if site.neuromancer.scanlines %} data-scanlines{% endif %}>
  {%- include head.html -%}
  <body class="layout-{{ page.layout | default: 'default' }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {%- include header.html -%}
    <main id="main" class="site-main container" tabindex="-1">
      {{ content }}
    </main>
    {%- include footer.html -%}
    <script src="{{ '/assets/js/neuromancer.js' | relative_url }}" defer></script>
    {%- include custom-footer.html -%}
  </body>
</html>
