---
layout: default
---
<article class="page">
  {%- if page.title %}
  <header class="page-header">
    <h1 class="page-title">{{ page.title | escape }}</h1>
    {%- if page.subtitle %}
    <p class="page-subtitle">{{ page.subtitle | escape }}</p>
    {%- endif %}
  </header>
  {%- endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
